<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Planes6</title>
    <link rel="stylesheet" href="src/css/login.css">
</head>

<body>
    <div class="container">

        <form id="login-form" class="form-box">
            <h1>Iniciar Sesión</h1>
            <input type="email" placeholder="Correo electrónico" required>
            <input type="password" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
            <p>¿No tienes cuenta? <a href="#" id="show-register">Regístrate aquí</a></p>
        </form>


        <form id="register-form" class="form-box hidden">
            <h1>Crear Cuenta</h1>
            <input type="text" id="name" placeholder="Nombre completo" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="reg-pass1" class="password" placeholder="Crea una contraseña" required>
            <input type="password" id="reg-pass2" class="password" placeholder="Repite la contraseña" required>
            <span id="incorrect">Las contraseñas no coinciden</span>
            <button type="submit" id="register">Registrarse</button>
            <p>¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión</a></p>
        </form>
    </div>

    <script type="module" src="src/js/login.js"></script>
</body>

</html>
