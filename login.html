<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Planes6</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">

        <form id="loginForm" class="form-box">
            <h1>Iniciar Sesión</h1>
            <input type="email" placeholder="Correo electrónico" required>
            <input type="password" placeholder="Contraseña" required>
            <button type="button" onclick="location.href='index.html'">Entrar</button>
            <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate aquí</a></p>
        </form>

        
        <form id="registerForm" class="form-box hidden">
            <h1>Crear Cuenta</h1>
            <input type="text" placeholder="Nombre completo" required>
            <input type="email" placeholder="Correo electrónico" required>
            <input type="password" class="password" placeholder="Crea una contraseña" required>
            <input type="password" class="password" placeholder="Repite la contraseña" required>
            <span id="incorrect">Las contraseñas no coinciden</span>
            <button type="submit" id="register">Registrarse</button>
            <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
